<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    :root {
      --fav-prim: #c4b5fd;
      --fav-sec: #a78bfa;
      --fav-acc: #818cf8;
      --fav-gls: #e0e7ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --fav-prim: #312e81;
        --fav-sec: #6d28d9;
        --fav-acc: #4338ca;
        --fav-gls: #1e1b4b;
      }
    }
  </style>
  <!-- Circuit tree crown -->
  <path d="M16 12V4" stroke="var(--fav-prim)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M16 8L11 4" stroke="var(--fav-prim)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M16 8L21 4" stroke="var(--fav-prim)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="16" cy="3" r="1.6" fill="var(--fav-sec)"/>
  <circle cx="11" cy="3.5" r="1.4" fill="var(--fav-sec)"/>
  <circle cx="21" cy="3.5" r="1.4" fill="var(--fav-sec)"/>
  <!-- Temporal circuit branches -->
  <path d="M11 13L7 9" stroke="var(--fav-sec)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="6.5" cy="8.5" r="1.2" fill="var(--fav-acc)"/>
  <path d="M21 13L25 9" stroke="var(--fav-sec)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="25.5" cy="8.5" r="1.2" fill="var(--fav-acc)"/>
  <!-- AI Face Silhouette -->
  <path d="M20 12C20 12 21.5 15.5 22 17.5C22.2 18.2 23 18.8 23.5 19.5L24 20.5C23.5 21 22.5 21.2 22.8 22L23 23.5C22 24.2 21.2 24.8 20 25.2L15.5 26.5C13.5 26 12 24.5 11 22.5C10 20.5 10 17 11.5 14C12.5 12 14 11.5 16 11.5" stroke="var(--fav-prim)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smart Glasses Frame & Glow -->
  <rect x="15" y="15" width="8" height="4.5" rx="1.2" fill="var(--fav-acc)" fill-opacity="0.25" stroke="var(--fav-gls)" stroke-width="1.8"/>
  <path d="M15 17.2H11.5" stroke="var(--fav-gls)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16.5" y1="16.2" x2="19.5" y2="16.2" stroke="var(--fav-gls)" stroke-width="1" stroke-linecap="round"/>
  <!-- Ear node -->
  <circle cx="11.5" cy="18" r="1.5" fill="var(--fav-sec)"/>
</svg>