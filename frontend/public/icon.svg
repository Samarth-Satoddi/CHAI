<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180" fill="none">
  <style>
    :root {
      --chai-bg: #070812;
      --chai-prim: #c4b5fd;
      --chai-sec: #a78bfa;
      --chai-acc: #818cf8;
      --chai-gls: #e0e7ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --chai-bg: #f8fafc;
        --chai-prim: #312e81;
        --chai-sec: #6d28d9;
        --chai-acc: #4338ca;
        --chai-gls: #1e1b4b;
      }
    }
  </style>
  <rect width="64" height="64" rx="16" fill="var(--chai-bg)" />
  <!-- Circuit tree crown -->
  <g stroke="var(--chai-prim)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 23 V10" stroke-width="2.2" />
    <path d="M32 16 L22 8" stroke-width="2.2" />
    <path d="M32 16 L42 8" stroke-width="2.2" />
    <path d="M24 25 L16 19 V13 L11 8" stroke="var(--chai-sec)" stroke-width="1.8" />
    <path d="M16 16 H8" stroke="var(--chai-sec)" stroke-width="1.8" />
    <path d="M39 24 L48 18 V12 L53 7" stroke="var(--chai-sec)" stroke-width="1.8" />
    <path d="M48 15 H56" stroke="var(--chai-sec)" stroke-width="1.8" />
  </g>
  <!-- Circuit nodes -->
  <g fill="var(--chai-sec)">
    <circle cx="32" cy="7" r="2.4" fill="var(--chai-acc)" />
    <circle cx="22" cy="8" r="2.2" />
    <circle cx="42" cy="8" r="2.2" />
    <circle cx="11" cy="8" r="1.8" fill="var(--chai-acc)" />
    <circle cx="8" cy="16" r="1.8" />
    <circle cx="53" cy="7" r="1.8" fill="var(--chai-acc)" />
    <circle cx="56" cy="15" r="1.8" />
  </g>
  <!-- AI Face Silhouette -->
  <path d="M37 23 C39.5 25 41 27.5 41.5 30.5 L45 35 L42 37.5 L43 39 L41.5 40.5 L43 45 L34 48 L33 57 M20 57 L22 47 C19 41 18.5 33 21 27 C22.5 24.5 25 23 27 22.5" stroke="var(--chai-prim)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34 48 C28 49 24 45 22 40" stroke="var(--chai-sec)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <!-- Ear node -->
  <circle cx="27" cy="39" r="3" stroke="var(--chai-sec)" stroke-width="1.8" fill="var(--chai-bg)" />
  <circle cx="27" cy="39" r="1.2" fill="var(--chai-acc)" />
  <!-- Smart Glasses -->
  <path d="M32.5 31.5 H45 C46.2 31.5 46.8 32.8 46.2 34.2 L44.2 38 C43.6 39.2 42.4 39.8 41.2 39.8 H33 C31.8 39.8 31.2 38.8 31.6 37.6 L32.5 34.5 Z" fill="var(--chai-acc)" fill-opacity="0.25" stroke="var(--chai-gls)" stroke-width="2" stroke-linejoin="round" />
  <path d="M32.5 33 L25 34.5" stroke="var(--chai-gls)" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="33" x2="43.5" y2="33" stroke="var(--chai-acc)" stroke-width="1.2" stroke-linecap="round" />
</svg>